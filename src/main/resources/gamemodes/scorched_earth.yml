id: scorched_earth
displayName: "Scorched Earth"
difficulty: EXTREME
description: "Rapid terrain cycling — nether, ocean, and storms."
minPlayers: 1
maxPlayers: 24
gracePeriodSeconds: 20
maxMatchSeconds: 900
lootTier: extreme
lootBoxDensity: high
initialTerrain: barren
