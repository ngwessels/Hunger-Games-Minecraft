    durationSeconds: 0
    lightningMinIntervalMs: 6000
    lightningMaxIntervalMs: 18000
    lightningMinIntensity: 0.1
    lightningRealStrikeThreshold: 0.5
    stormFireBurnChancePerTick: 0.12
    stormFireBurnChecksPerTick: 500
